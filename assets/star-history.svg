<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">LLMPET GitHub Star History</title>
  <desc id="desc">A hand-drawn line chart showing LLMPET growing from 1 star on July 2, 2026 to 91 stars on August 10, 2026.</desc>
  <defs>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="warmFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee7348" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ee7348" stop-opacity=".02"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="884" height="454" rx="26" fill="#fffaf4" stroke="#2d2735" stroke-width="3"/>
  <path d="M30 24 C190 8 699 13 870 27" fill="none" stroke="#d9cbd8" stroke-width="2" stroke-linecap="round" opacity=".7"/>

