<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="archive.css" />
    <title>LLMPET · 会话档案馆</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="titlebar">
        <div class="brand">
          <div class="brand-mark">📚</div>
          <div>
            <h1 id="page-title">会话档案馆</h1>
            <p id="page-subtitle">Claude Code 与 Codex 的全部本机会话</p>
          </div>
        </div>
        <button class="icon-button" id="close" aria-label="关闭">✕</button>
      </header>

      <section class="summary-grid">
        <article class="summary-card emphasis">
          <span id="summary-total-label">全部会话</span>
          <strong id="summary-total">—</strong>
          <small id="summary-split">Claude — · Codex —</small>
        </article>
        <article class="summary-card">
          <span id="summary-source-label">来源</span>
          <strong id="summary-source">—</strong>
          <small id="summary-source-split">客户端 — · CLI —</small>
        </article>
        <article class="summary-card">
          <span id="summary-backup-label">本机备份</span>
          <strong id="summary-backup">—</strong>
          <small id="summary-backup-time">尚未备份</small>
        </article>
        <article class="backup-card">
          <div class="backup-copy">
            <strong id="backup-title">定期备份</strong>
            <small id="backup-note">默认关闭 · 只存本机 · 不上传云端</small>
          </div>
          <label class="switch" title="定期备份">
            <input id="backup-toggle" type="checkbox" />
            <span></span>
          </label>
          <select id="backup-interval" aria-label="备份周期">
            <option value="6">每 6 小时</option>
            <option value="12">每 12 小时</option>
            <option value="24">每天</option>
            <option value="72">每 3 天</option>
            <option value="168">每周</option>
          </select>
          <button id="backup-now" class="soft-button">立即备份</button>
          <button id="backup-folder" class="soft-button quiet">打开目录</button>
        </article>
      </section>

      <main class="workspace">
        <aside class="library">
          <div class="library-tools">
            <input id="search" type="search" placeholder="搜索标题、项目、路径或 Session ID" autocomplete="off" />
            <div class="filters" id="provider-filters">
              <button class="active" data-provider="all">全部</button>
              <button data-provider="claude">Claude</button>
              <button data-provider="codex">Codex</button>
            </div>
            <div class="filters compact" id="origin-filters">
              <button class="active" data-origin="all">全来源</button>
              <button data-origin="desktop">客户端</button>
              <button data-origin="cli">CLI</button>
              <button data-origin="backed-up">已备份</button>
            </div>
          </div>
          <div class="library-head">
            <strong id="result-count">正在扫描…</strong>
            <span id="scan-time"></span>
          </div>
          <div id="session-list" class="session-list"></div>
        </aside>

        <section id="detail" class="detail empty-detail">
          <div class="empty-illustration">⌁</div>
          <h2 id="empty-title">选择一条会话</h2>
          <p id="empty-copy">查看来源、项目、备份状态，并继续或交给另一个 Agent 接管。</p>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status">索引只保存元数据；会话正文仍由 Claude/Codex 管理。</span>
        <span id="storage-size"></span>
      </footer>
    </div>
    <script src="archive.js"></script>
  </body>
</html>
