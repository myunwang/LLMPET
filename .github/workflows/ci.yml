name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 冒烟测试只依赖 Node 内置模块 + 仓库内文件（不 require electron），
      # 所以无需 npm install —— 直接跑，快且不受 electron 二进制下载影响。
      - name: Smoke + renderer tests
        run: npm test

  electron-install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Headless tests do not install Electron; verify the real binary separately.
      - run: npm ci --foreground-scripts
      - run: npm run install:electron
      - run: npm run check:electron
      - name: Verify Electron can execute
        run: npx --no-install electron --version
      - name: Exercise desktop windows, IPC and permission round-trip
        run: npm run test:electron
      - name: Exercise native Windows pet window interactions
        if: runner.os == 'Windows'
        run: npm run test:windows
